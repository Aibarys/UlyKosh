name: UlyKosh
options:
  bundleIdPrefix: kz.ulykosh
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: ru
  localizations: [ru, kk]
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_EMIT_LOC_STRINGS: YES
    SWIFT_STRICT_CONCURRENCY: minimal
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: VTP9UAM5MH
    TARGETED_DEVICE_FAMILY: "1"
    # Иначе скрипт очистки xattr не может трогать бандл.
    ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  UlyKosh:
    type: application
    platform: iOS
    sources:
      - path: UlyKosh
      - path: UlyKoshWidget/WidgetViews.swift
    info:
      path: UlyKosh/Info.plist
      properties:
        CFBundleDisplayName: Ұлы Көш
        CFBundleDevelopmentRegion: ru
        CFBundleLocalizations: [ru, kk]
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchRider
          UIImageRespectsSafeAreaInsets: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSHealthShareUsageDescription: "Ұлы Көш читает шаги и пройденное расстояние, чтобы превращать их в километры пути вашего аула."
        NSHealthUpdateUsageDescription: "Приложение не записывает данные в Здоровье."
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: UlyKosh/UlyKosh.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        com.apple.developer.healthkit.background-delivery: true
        com.apple.security.application-groups: [group.kz.ulykosh]
    dependencies:
      - target: UlyKoshWidget
        embed: true
    postBuildScripts:
      - name: Strip extended attributes before codesign
        script: |
          # macOS помечает файлы com.apple.provenance, а codesign отказывается подписывать бандл с такими атрибутами.
          xattr -cr "${CODESIGNING_FOLDER_PATH}" 2>/dev/null || true
        basedOnDependencyAnalysis: false

  UlyKoshWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: UlyKoshWidget
      - path: UlyKosh/Shared
      - path: UlyKosh/Resources/Localizable.xcstrings
      - path: UlyKosh/Views/Theme.swift
      - path: UlyKosh/Views/Icons/Pictograms.swift
    info:
      path: UlyKoshWidget/Info.plist
      properties:
        CFBundleDisplayName: Ұлы Көш
        CFBundleDevelopmentRegion: ru
        CFBundleLocalizations: [ru, kk]
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: UlyKoshWidget/UlyKoshWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.kz.ulykosh]
    settings:
      base:
        SWIFT_EMIT_LOC_STRINGS: YES
        PRODUCT_BUNDLE_IDENTIFIER: kz.ulykosh.UlyKosh.Widget
        SKIP_INSTALL: YES
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: ""
    postBuildScripts:
      - name: Strip extended attributes before codesign
        script: |
          xattr -cr "${CODESIGNING_FOLDER_PATH}" 2>/dev/null || true
        basedOnDependencyAnalysis: false
